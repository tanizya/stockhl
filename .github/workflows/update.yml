name: Update Stock Data & Deploy

on:
  schedule:
    # Weekdays at UTC 22:00 (= US Eastern 17:00, after market close)
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Restore data cache (#6)
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data_cache.json
          key: stock-data-cache-${{ github.run_id }}
          restore-keys: |
            stock-data-cache-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data and build site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_and_build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
